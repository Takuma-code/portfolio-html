<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポートフォリオ | Takuma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Takuma</div>
      <button class="nav-toggle" aria-label="メニューを開閉">☰</button>
      <ul>
        <li><a href="#home">ホーム</a></li>
        <li><a href="#about">自己紹介</a></li>
        <li><a href="#works">実績</a></li>
        <li><a href="#skills">スキル</a></li>
        <li><a href="#contact">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero-section">
      <div class="hero-slide">
        <img class="slide" src="https://images.unsplash.com/photo-1531973486364-5fa64260d75b" alt="スライド画像1">
        <img class="slide" src="https://european-pirateparty.eu/wp-content/uploads/2020/03/freestocks-I_pOqP6kCOI-unsplash-scaled.jpg" alt="スライド画像2">
        <img class="slide" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Code_on_computer_monitor_(Unsplash).jpg/1024px-Code_on_computer_monitor_(Unsplash).jpg" alt="スライド画像3">
      </div>
      <div class="hero-content">
        <h1 class="hidden">こんにちは、<span>Takuma</span>です。</h1>
        <p class="hidden">社内システム開発に20年以上従事し、設計から運用・マネジメントまで幅広く対応してきたエンジニアです。</p>
      </div>
    </section>

    <section id="about">
      <!-- 省略（前回と同じ） -->
    </section>

    <section id="contact">
      <h2 class="hidden">お問い合わせ</h2>
      <p class="hidden">お仕事のご相談・ご依頼は下記フォームよりご連絡ください。</p>
      <form class="hidden" action="https://formspree.io/f/yourFormID" method="POST">
        <div>
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">送信</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Takuma</p>
  </footer>

  <script>
    // アニメーション表示
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target);
        }
      });
    });
    document.querySelectorAll('.hidden').forEach(el => observer.observe(el));

    // ナビゲーション開閉
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.navbar ul');
    if (navToggle) {
      navToggle.addEventListener('click', () => {
        navMenu.classList.toggle('open');
      });
    }

    // スムーススクロール
    document.querySelectorAll('a[href^=\"#\"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // スライドショー自動切り替え
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;
    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.style.display = (i === index) ? 'block' : 'none';
      });
    }
    showSlide(currentSlide);
    setInterval(() => {
      currentSlide = (currentSlide + 1) % slides.length;
      showSlide(currentSlide);
    }, 3000); // 3秒ごとに切り替え
  </script>
</body>
</html>
