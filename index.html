<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポートフォリオ | Takuma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Takuma</div>
      <button class="nav-toggle" aria-label="メニューを開閉">☰</button>
      <ul class="nav-menu">
        <li><a href="#home">ホーム</a></li>
        <li><a href="#about">自己紹介</a></li>
        <li><a href="#skills">スキル</a></li>
        <li><a href="#contact">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="hero-section">
      <div class="hero-slide">
        <img src="https://images.unsplash.com/photo-1531973486364-5fa64260d75b" alt="スライド画像1">
      </div>
      <div class="hero-content">
        <h1 class="hidden">こんにちは、<span>Takuma</span>です。</h1>
        <p class="hidden">社内システム開発に20年以上従事したフルスタックエンジニアです。</p>
      </div>
    </section>

    <section id="about">
      <h2 class="hidden">自己紹介</h2>
      <p class="hidden">社内システムの開発・運用に20年以上従事し、設計〜保守、PMまで一貫して対応してきました。</p>
    </section>

    <section id="skills">
      <h2 class="hidden">スキル</h2>
      <ul class="hidden">
        <li>VBA / VB / Java</li>
        <li>HTML / CSS / JavaScript</li>
        <li>Python / Vue.js</li>
        <li>WordPress / Web制作</li>
      </ul>
    </section>

    <section id="contact">
      <h2 class="hidden">お問い合わせ</h2>
      <p class="hidden">お仕事のご相談・ご依頼は下記フォームよりご連絡ください。</p>
      <form class="hidden" action="https://formspree.io/f/yourFormID" method="POST">
        <div>
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">送信</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Takuma</p>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target);
        }
      });
    });
    document.querySelectorAll('.hidden').forEach(el => observer.observe(el));

    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-menu');
    navToggle.addEventListener('click', () => {
      navMenu.classList.toggle('open');
    });

    document.querySelectorAll('a[href^=\"#\"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
</body>
</html>
